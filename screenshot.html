<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevCodec Screenshots</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 1280px;
      height: 800px;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .screenshot-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      display: flex;
      gap: 40px;
    }
    .screenshot-info {
      width: 400px;
    }
    .screenshot-info h1 {
      font-size: 42px;
      margin: 0 0 20px 0;
      color: #1976D2;
    }
    .screenshot-info p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
      margin: 0 0 30px 0;
    }
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .feature-list li {
      font-size: 16px;
      padding: 10px 0;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .feature-list li::before {
      content: "✓";
      color: #4CAF50;
      font-weight: bold;
      font-size: 20px;
    }
    .extension-preview {
      width: 400px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .extension-preview iframe {
      width: 100%;
      height: 500px;
      border: none;
    }
  </style>
</head>
<body>
  <div class="screenshot-container">
    <div class="screenshot-info">
      <h1>DevCodec</h1>
      <p>All-in-one developer encoding/decoding tool for Chrome</p>
      <ul class="feature-list">
        <li>Base64 Encode/Decode</li>
        <li>URL Encode/Decode</li>
        <li>JWT Token Decoder</li>
        <li>HTML Entity Converter</li>
        <li>Timestamp Converter</li>
        <li>Hash Generator (MD5/SHA-256)</li>
      </ul>
    </div>
    <div class="extension-preview">
      <iframe src="popup.html"></iframe>
    </div>
  </div>
  
  <script>
    // Auto-capture instructions
    console.log('To capture screenshot:');
    console.log('1. Use browser dev tools screenshot feature');
    console.log('2. Or use system screenshot tool (Cmd+Shift+4 on Mac)');
    console.log('3. Save as PNG, 1280x800 recommended');
  </script>
</body>
</html>
