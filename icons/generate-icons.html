<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Icon Generator</title>
</head>
<body>
  <canvas id="canvas" width="128" height="128"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Background circle
    ctx.fillStyle = '#1976D2';
    ctx.beginPath();
    ctx.arc(64, 64, 60, 0, Math.PI * 2);
    ctx.fill();
    
    // Code brackets
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Left bracket
    ctx.beginPath();
    ctx.moveTo(44, 44);
    ctx.lineTo(28, 64);
    ctx.lineTo(44, 84);
    ctx.stroke();
    
    // Right bracket
    ctx.beginPath();
    ctx.moveTo(84, 44);
    ctx.lineTo(100, 64);
    ctx.lineTo(84, 84);
    ctx.stroke();
    
    // Wrench
    ctx.beginPath();
    ctx.moveTo(72, 36);
    ctx.lineTo(88, 52);
    ctx.stroke();
    
    // Wrench head (circle)
    ctx.beginPath();
    ctx.arc(92, 56, 8, 0, Math.PI * 2);
    ctx.stroke();
    
    // Export
    const dataURL = canvas.toDataURL('image/png');
    console.log(dataURL);
    
    // Download links for different sizes
    const sizes = [16, 32, 48, 128];
    sizes.forEach(size => {
      const smallCanvas = document.createElement('canvas');
      smallCanvas.width = size;
      smallCanvas.height = size;
      const smallCtx = smallCanvas.getContext('2d');
      smallCtx.drawImage(canvas, 0, 0, size, size);
      
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = smallCanvas.toDataURL('image/png');
      link.textContent = `Download icon${size}.png`;
      link.style.display = 'block';
      document.body.appendChild(link);
    });
  </script>
</body>
</html>
